# Engine config for judge end-to-end fixture (issue #66).
# Synthetic agreements only — no real corpus, no real parties.
# Uses the existing affiliation-agreement taxonomy (see spec/taxonomy/).
agreement_type:
  id: fixture-affiliation
  name: "Fixture Affiliation Agreement"
  description: >
    Synthetic agreement type used only for judge end-to-end testing.

baseline:
  template: null

# Path relative to this config file.
taxonomy: ../../spec/taxonomy/affiliation-agreement.yaml

provenance:
  our_party_aliases:
    - "FixtureCorp"
    - "TestOrg"

# Issue #107: this fixture is affiliation-typed (see agreement_type/taxonomy
# above), so it carries the same restore-prior-behavior keys as
# examples/affiliation-config/playbook.config.yaml, even though nothing in
# this repo currently runs it through `playbook publish` — a future publish
# of judge-fixture output should not silently regress to the neutral
# defaults.
scan_role_words_extra:
  - educational
  - academic
  - affiliated
  - affiliate

scan_stopwords_extra:
  - school
  - student
  - students
  - university
  - college
