name: Docker Publish

# Builds the canonical docling/OCR runtime (Dockerfile) and pushes it to
# GHCR on every version tag. This is the release path for the Docker image;
# see docker-smoke.yml for the recurring health check of the same image
# that runs independently of a release. PyPI publishing is its sibling
# workflow, `pypi-publish.yml`, fired by the GitHub Release rather than by
# this tag push — see CONTRIBUTING.md "Cutting a release".
#
# Plain `docker build`/`docker push` (no buildx) — the local runner pool
# provides a container daemon via DOCKER_HOST but doesn't support
# buildx/QEMU or GitHub's container:/services: job containers.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          image="ghcr.io/${{ github.repository }}"
          # Semver pre-release tags (e.g. v1.1.0-rc1) carry a `-` after the
          # version core — never move `:latest` onto one of those (issue
          # #114: this only ever worked in theory before the first real
          # tag, and CONTRIBUTING.md's release procedure only names plain
          # `vX.Y.Z` tags).
          if [[ "$ref" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          {
            echo "image=$image"
            echo "ref=$ref"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          tags=(-t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref }}")
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "false" ]; then
            tags+=(-t "${{ steps.meta.outputs.image }}:latest")
          fi
          docker build "${tags[@]}" .

      - name: Push image (:<tag>, plus :latest for non-pre-release tags)
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref }}"
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "false" ]; then
            docker push "${{ steps.meta.outputs.image }}:latest"
          fi
