name: Docker Smoke Test

# Exercises the canonical docling/OCR runtime (Dockerfile) end to end. The
# unit suite (ci.yml) runs in a venv against the legacy adapters only — it
# never builds or runs this image, so the "canonical runtime" the README
# points adopters at could break silently between releases (issue #176).
# Runs weekly (drift/upstream breakage) and whenever the image's own inputs
# change.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  push:
    paths:
      - "Dockerfile"
      - "docker/constraints.txt"
      - "pyproject.toml"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t playbook-engine:smoke .

      - name: Installed docling stack matches docker/constraints.txt
        run: |
          # Every `name==version` pin in the constraints file must be what is
          # actually installed (torch carries a +cpu local suffix). Fails the
          # build if a pin silently drifted instead of letting extraction
          # degrade later (issue #244).
          docker run --rm -v "$PWD/docker/constraints.txt:/c.txt:ro" \
            --entrypoint python playbook-engine:smoke -c "
          import importlib.metadata as m
          bad = []
          for line in open('/c.txt'):
              line = line.split('#')[0].strip()
              if not line:
                  continue
              name, want = line.split('==')
              have = m.version(name).split('+')[0]
              if have != want:
                  bad.append(f'{name}: pinned {want}, installed {have}')
          assert not bad, bad
          print('OK pins match')
          "

      - name: lint-corpus against the judge-fixture corpus
        run: |
          docker run --rm \
            -v "$PWD/examples/judge-fixture/corpus:/work/corpus:ro" \
            playbook-engine:smoke lint-corpus /work/corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build a scanned (image-only, no text layer) PDF fixture
        run: |
          pip install --quiet pillow fpdf2 python-docx
          mkdir -p /tmp/ocr-fixture
          python - <<'PY'
          from pathlib import Path

          from fpdf import FPDF
          from PIL import Image, ImageDraw, ImageFont

          # Synthetic clause text, fictitious parties only — same convention
          # as tests/test_pdf_ingester.py's programmatic fixtures. Rendered
          # to an image and embedded with NO text layer, so the container's
          # docling/RapidOCR stack — not pdfplumber's text extraction — is
          # what has to read it back.
          text = "INDEMNIFICATION. Alpha Corp shall indemnify Beta Ltd."
          img = Image.new("RGB", (1600, 300), "white")
          draw = ImageDraw.Draw(img)
          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 48
          )
          draw.text((40, 100), text, fill="black", font=font)
          img_path = Path("/tmp/ocr-fixture/page.png")
          img.save(img_path)

          pdf = FPDF(unit="pt", format=(1600, 300))
          pdf.add_page()
          pdf.image(str(img_path), x=0, y=0, w=1600, h=300)
          pdf.output("/tmp/ocr-fixture/scanned.pdf")

          # The same scan with a small text layer on top, as a signature stamp
          # or scanner header leaves. docling 2.113 skipped OCR on such files
          # and returned little more than the stamp (issue #252). This step
          # asserts that the scanned words come back. It does not test the
          # engine's full-page OCR switch: docling 2.140 with tesseract reads
          # this page in its default OCR mode too. The unit tests cover the
          # switch.
          stamped = FPDF(unit="pt", format=(1600, 300))
          stamped.set_font("Helvetica", size=10)
          stamped.add_page()
          stamped.image(str(img_path), x=0, y=0, w=1600, h=300)
          stamped.set_xy(10, 10)
          stamped.cell(0, 12, "Executed copy 2026")
          stamped.output("/tmp/ocr-fixture/stamped.pdf")

          # A DOCX with an XML comment directly under w:body, as form-template
          # generators leave. docling's Word backend crashes on it in every
          # release, so the engine must hand docling a copy without it and the
          # version must still come out 'docling', not the legacy fallback.
          from docx import Document
          from lxml import etree

          doc = Document()
          doc.add_heading("Confidentiality", level=1)
          doc.add_paragraph("Alpha Corp shall keep Beta Ltd information secret.")
          doc.element.body.insert(1, etree.Comment(" generated by the form template "))
          doc.save("/tmp/ocr-fixture/commented.docx")
          PY
          chmod -R a+rX /tmp/ocr-fixture

      - name: Run the scanned PDFs through docling/OCR extraction, assert the words came back
        run: |
          docker run --rm \
            -v /tmp/ocr-fixture:/fixture:ro \
            --entrypoint python \
            playbook-engine:smoke -c "
          import re
          from pathlib import Path
          from playbook_engine.extraction import extract_blocks

          # extractor=docling alone does not prove the OCR is right: docling
          # 2.113 labelled garbled output (wrong recognizer) 'docling' too
          # (issue #252). Assert the words themselves.
          want = {'indemnification', 'alpha', 'corp', 'shall', 'indemnify', 'beta', 'ltd'}
          for name in ('scanned.pdf', 'stamped.pdf'):
              canonical_text, blocks, extractor = extract_blocks(Path('/fixture') / name)
              assert extractor == 'docling', f'{name}: expected docling extractor, got {extractor!r}'
              assert canonical_text.strip(), f'{name}: OCR extraction yielded no text'
              tokens = re.findall(r'[a-z]+', canonical_text.lower())
              found = want & set(tokens)
              assert len(found) >= 6, f'{name}: only {sorted(found)} of {sorted(want)} came back: {canonical_text!r}'
              assert max(map(len, tokens)) <= 20, f'{name}: words joined together: {canonical_text!r}'
              print(f'OK {name} extractor={extractor} words={len(tokens)} recovered={len(found)}/{len(want)}')

          canonical_text, blocks, extractor = extract_blocks(Path('/fixture/commented.docx'))
          assert extractor == 'docling', f'commented.docx: expected docling extractor, got {extractor!r} ({extractor.reason})'
          assert 'Alpha Corp shall keep Beta Ltd' in canonical_text, canonical_text
          print(f'OK commented.docx extractor={extractor}')
          "
